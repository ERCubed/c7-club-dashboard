version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  ignore:
  # json 3.0 changed JSON.parse's signature, and ActiveSupport 8.1.3.x
  # still calls the old one, so every jsonb read breaks (see the pin in
  # the Gemfile). Drop this with the Rails upgrade that supports json 3.
  - dependency-name: json
    update-types: [ "version-update:semver-major" ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
